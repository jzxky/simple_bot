<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Player Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="top-nav">
    <a href="/" class="nav-brand">Player Hub</a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Players</a>
      <a href="/groups" class="nav-link {% if request.path == '/groups' %}active{% endif %}">Groups</a>
      <a href="/clients" class="nav-link {% if request.path == '/clients' %}active{% endif %}">Clients</a>
      <a href="/war" class="nav-link {% if request.path == '/war' %}active{% endif %}">War Mode</a>
      {% if user and user.role == 'admin' %}
      <span class="nav-sep">|</span>
      <a href="/admin/tables" class="nav-link {% if '/admin/tables' in request.path %}active{% endif %}">Tables</a>
      <a href="/admin/users" class="nav-link {% if '/admin/users' in request.path %}active{% endif %}">Users</a>
      {% endif %}
    </div>
    <div class="nav-right">
      <span class="nav-user">{{ session.username }} <span class="role-badge role-{{ session.role }}">{{ session.role }}</span></span>
      <a href="/logout" class="nav-link">Logout</a>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>

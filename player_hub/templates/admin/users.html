{% extends "base.html" %}
{% block title %}Users — Player Hub{% endblock %}

{% block content %}
<div class="page-header">
  <h1>User Management</h1>
  <button class="btn-primary" onclick="showCreateUser()">Create User</button>
</div>

<div id="user-form" class="card" style="display:none">
  <h2>Create New User</h2>
  <form class="inline-form" onsubmit="createUser(event)">
    <input type="text" id="cu-username" placeholder="Username" required>
    <input type="password" id="cu-password" placeholder="Password" required>
    <select id="cu-role">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit" class="btn-primary">Create</button>
    <button type="button" class="btn-secondary" onclick="hideCreateUser()">Cancel</button>
  </form>
</div>

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th><th>Username</th><th>Role</th>
        <th>Created</th><th>Last Login</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="usr-tbody"></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
  var USER_ROLE = "{{ user.role }}";
</script>
<script src="{{ url_for('static', filename='admin.js') }}"></script>
{% endblock %}

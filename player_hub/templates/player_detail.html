{% extends "base.html" %}
{% block title %}{{ player_name }} — Player Hub{% endblock %}

{% block content %}
<div class="page-header">
  <h1><a href="/" class="back-link">← Players</a> / <span id="pd-name">{{ player_name }}</span></h1>
  {% if user.role == 'admin' %}
  <button class="btn-danger" onclick="deletePlayer('{{ player_name }}')">Delete Player</button>
  {% endif %}
</div>
<div id="pd-content">Loading...</div>
{% endblock %}

{% block scripts %}
<script>
  var USER_ROLE = "{{ user.role }}";
  var PLAYER_NAME = "{{ player_name }}";
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}

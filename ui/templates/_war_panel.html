<div id="war-disabled" class="card" style="display:none">
  <p class="war-empty">War Mode is disabled. Enable it under Settings → War Mode.</p>
</div>

<div id="war-content" style="display:none">
  <section class="card">
    <h2>WS Monitoring</h2>
    <div class="card-body">
      <div class="war-add">
        <input type="text" id="war-add-name" placeholder="Player name">
        <select id="war-add-side">
          <option value="opps">Opps</option>
          <option value="friendlies">Friendlies</option>
        </select>
        <button class="btn-secondary" onclick="warAdd()">Add</button>
        <span style="flex:1"></span>
        <label style="flex:none;color:var(--muted);font-size:0.8rem">Check every
          <input type="number" id="war-interval" min="0" max="60" step="1" value="5"
                 onchange="warSetInterval()" style="width:52px"> min
          <input type="number" id="war-interval-sec" min="0" max="59" step="1" value="0"
                 onchange="warSetInterval()" style="width:52px"> sec
        </label>
        <button class="btn-secondary" onclick="warCheckNow()">Check Now</button>
      </div>
      <div id="war-add-msg" style="font-size:0.8rem;margin-bottom:8px"></div>
    </div>
  </section>

  <section class="card">
    <h2>Opps</h2>
    <div class="card-body"><div id="war-opps"></div></div>
  </section>

  <section class="card">
    <h2>Friendlies</h2>
    <div class="card-body"><div id="war-friendlies"></div></div>
  </section>

  <section class="card">
    <h2>War Log <button class="btn-secondary" style="float:right;padding:3px 10px" onclick="warClearEvents()">Clear</button></h2>
    <div class="card-body"><div class="war-log" id="war-log"></div></div>
  </section>
</div>

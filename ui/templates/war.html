<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MafiaMatrix Bot — War Mode</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .war-add { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .war-add input[type=text] { width:200px; }
  .war-table { width:100%; border-collapse:collapse; margin-bottom:8px; font-size:0.82rem; }
  .war-table th, .war-table td { border:1px solid var(--border); padding:5px 7px; text-align:left; }
  .war-table th { background:var(--surface2); color:var(--muted); text-transform:uppercase; font-size:0.7rem; letter-spacing:.04em; }
  .war-status { font-weight:700; }
  .war-status.Open { color:#5bbf5b; }
  .war-status.In-Window { color:#e0a53a; }
  .war-status.Protected { color:#cc5555; }
  .war-remove { background:transparent; border:none; color:var(--red); cursor:pointer; font-size:1rem; }
  .war-log { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:8px; height:200px; overflow-y:auto; font-family:monospace; font-size:0.78rem; }
  .war-log-line { padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .war-empty { color:var(--muted); font-style:italic; }
  .war-time-input { width:150px; font-size:0.78rem; }
  .war-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  /* Phones: stack each row into a labelled card instead of a wide table. */
  @media (max-width: 640px) {
    .container { padding:12px; }
    .war-add input[type=text] { width:100%; }
    .war-table-wrap { overflow-x:visible; }
    .war-table { font-size:0.85rem; }
    .war-table thead { display:none; }
    .war-table, .war-table tbody, .war-table tr, .war-table td { display:block; width:100%; }
    .war-table tr { border:1px solid var(--border); border-radius:8px; margin-bottom:10px; background:var(--surface2); }
    .war-table td { border:none; border-bottom:1px solid rgba(255,255,255,.06); padding:8px 12px;
                    display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .war-table td:last-child { border-bottom:none; }
    .war-table td::before { content:attr(data-label); color:var(--muted); font-size:0.7rem;
                            text-transform:uppercase; letter-spacing:.04em; flex:0 0 auto; }
    .war-table td[data-label=""]::before { content:""; }
    .war-time-input { width:auto; flex:1; min-width:0; }
    .war-table select { width:auto; max-width:60%; }
  }
</style>
</head>
<body>
<div class="container">
  <header style="position:relative">
    <h1><a href="/" style="color:var(--accent);text-decoration:none">← Back</a> &nbsp; War Mode</h1>
  </header>
  <main>
    <div id="war-disabled" class="card" style="display:none">
      <p class="war-empty">War Mode is disabled. Enable it under Settings → War Mode.</p>
    </div>

    <div id="war-content" style="display:none">
      <section class="card">
        <h2>WS Monitoring</h2>
        <div class="card-body">
          <div class="war-add">
            <input type="text" id="war-add-name" placeholder="Player name">
            <select id="war-add-side">
              <option value="opps">Opps</option>
              <option value="friendlies">Friendlies</option>
            </select>
            <button class="btn-secondary" onclick="warAdd()">Add</button>
            <span style="flex:1"></span>
            <label style="flex:none;color:var(--muted);font-size:0.8rem">Check every
              <select id="war-interval" onchange="warSetInterval()" style="width:90px">
                <option value="2">2 min</option><option value="3">3 min</option>
                <option value="4">4 min</option><option value="5">5 min</option>
                <option value="6">6 min</option><option value="7">7 min</option>
                <option value="8">8 min</option><option value="9">9 min</option>
                <option value="10">10 min</option>
              </select>
            </label>
            <button class="btn-secondary" onclick="warCheckNow()">Check Now</button>
          </div>
          <div id="war-add-msg" style="font-size:0.8rem;margin-bottom:8px"></div>
        </div>
      </section>

      <section class="card">
        <h2>Opps</h2>
        <div class="card-body"><div id="war-opps"></div></div>
      </section>

      <section class="card">
        <h2>Friendlies</h2>
        <div class="card-body"><div id="war-friendlies"></div></div>
      </section>

      <section class="card">
        <h2>War Log <button class="btn-secondary" style="float:right;padding:3px 10px" onclick="warClearEvents()">Clear</button></h2>
        <div class="card-body"><div class="war-log" id="war-log"></div></div>
      </section>
    </div>
  </main>
</div>

<script>
const WHACK_TYPES = ["Normal", "Bodyguard"];

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtTime(s) { return s || "—"; }
function toLocalInput(s) { return s ? s.replace(" ", "T").slice(0,16) : ""; }

function warTable(side, rows) {
  if (!rows.length) return '<p class="war-empty">No names tracked.</p>';
  const head = `<tr><th>Name</th><th>WS</th><th>Status</th><th>Whack Type</th><th>Last Whack</th><th>Window Open</th><th>Window Close</th><th></th></tr>`;
  const body = rows.map(r => `
    <tr>
      <td data-label="Name">${esc(r.name)}</td>
      <td data-label="WS">${r.ws == null ? "—" : r.ws}</td>
      <td data-label="Status" class="war-status ${r.status}">${r.status}</td>
      <td data-label="Whack Type">
        <select onchange="warSetType('${side}','${esc(r.name)}',this.value)">
          ${WHACK_TYPES.map(t => `<option value="${t}" ${r.whack_type===t?'selected':''}>${t}</option>`).join("")}
        </select>
      </td>
      <td data-label="Last Whack"><input type="datetime-local" class="war-time-input" value="${toLocalInput(r.last_whack_time)}"
            onchange="warSetTime('${side}','${esc(r.name)}',this.value)"></td>
      <td data-label="Window Open">${fmtTime(r.window_open)}</td>
      <td data-label="Window Close">${fmtTime(r.window_close)}</td>
      <td data-label=""><button class="war-remove" title="Remove" onclick="warRemove('${side}','${esc(r.name)}')">✕</button></td>
    </tr>`).join("");
  return `<div class="war-table-wrap"><table class="war-table">${head}${body}</table></div>`;
}

function warRender(d) {
  document.getElementById("war-disabled").style.display = d.enabled ? "none" : "";
  document.getElementById("war-content").style.display = d.enabled ? "" : "none";
  if (!d.enabled) return;
  document.getElementById("war-opps").innerHTML = warTable("opps", d.opps || []);
  document.getElementById("war-friendlies").innerHTML = warTable("friendlies", d.friendlies || []);
  const iv = document.getElementById("war-interval");
  if (iv && !iv.matches(":focus")) iv.value = String(d.interval || 5);
  const log = document.getElementById("war-log");
  const events = d.events || [];
  log.innerHTML = events.length
    ? events.map(e => `<div class="war-log-line">[${esc(e.ts)}] ${esc(e.message)}</div>`).join("")
    : '<span class="war-empty">No war events yet.</span>';
}

function warLoad() {
  fetch("/api/war/lists").then(r => r.json()).then(warRender).catch(()=>{});
}

function warAdd() {
  const name = document.getElementById("war-add-name").value.trim();
  const side = document.getElementById("war-add-side").value;
  const msg = document.getElementById("war-add-msg");
  if (!name) return;
  fetch("/api/war/add", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, side})}).then(r => r.json()).then(d => {
      msg.textContent = d.message || "";
      msg.style.color = d.ok ? "var(--success)" : "var(--red)";
      if (d.ok) document.getElementById("war-add-name").value = "";
      warLoad();
    });
}
function warRemove(side, name) {
  fetch("/api/war/remove", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, side})}).then(() => warLoad());
}
function warSetType(side, name, whack_type) {
  fetch("/api/war/set_whack_type", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, side, whack_type})}).then(() => warLoad());
}
function warSetTime(side, name, time) {
  fetch("/api/war/set_whack_time", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, side, time})}).then(() => warLoad());
}
function warSetInterval() {
  const minutes = parseInt(document.getElementById("war-interval").value) || 5;
  fetch("/api/war/set_interval", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({minutes})});
}
function warCheckNow() {
  fetch("/api/war/check", {method:"POST"}).then(r => r.json()).then(d => {
    const msg = document.getElementById("war-add-msg");
    if (!d.ok) { msg.textContent = d.message || "Check failed."; msg.style.color = "var(--red)"; }
    else { msg.textContent = "Check queued."; msg.style.color = "var(--muted)"; }
  });
}
function warClearEvents() {
  fetch("/api/war/clear_events", {method:"POST"}).then(() => warLoad());
}

warLoad();
setInterval(warLoad, 5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MafiaMatrix Bot — Players</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header style="position:relative">
    <h1><a href="/" style="color:var(--accent);text-decoration:none">← Back</a> &nbsp; Players</h1>
  </header>

  <main>
    <section class="card tabs-card">
      <div class="card-body">
        <div class="tab-bar">
          <button class="tab-btn active" onclick="showTab('pl-tab-list', this)">Player List</button>
          <button class="tab-btn" onclick="showTab('pl-tab-groups', this)">Groups</button>
          <button class="tab-btn" onclick="showTab('pl-tab-dead', this); plRenderRecentDead()">Obituaries</button>
          <button class="tab-btn" onclick="showTab('pl-tab-born', this); plRenderRecentBorn()">Births</button>
        </div>

        <!-- Player List tab -->
        <div id="pl-tab-list" class="tab-panel active">
          <div class="pl-toolbar">
            <label class="inline-toggle" title="Auto-whitelist Boss / Don / Godfather / Capo di tutti capi on every list update">Whitelist Bolds
              <label class="toggle-label">
                <input type="checkbox" id="pl-bolds-toggle" onchange="plBoldsToggleChanged()">
                <span class="toggle"></span>
              </label>
            </label>
            <label class="inline-toggle" style="white-space:nowrap;margin-left:auto">Active only
              <label class="toggle-label">
                <input type="checkbox" id="pl-filter-active" checked onchange="plFilter()">
                <span class="toggle"></span>
              </label>
            </label>
            <div style="position:relative">
              <button class="btn-secondary" onclick="togglePlColMenu()" id="pl-col-menu-btn">Columns ▾</button>
              <div id="pl-col-menu" style="display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;z-index:200;white-space:nowrap;min-width:150px">
                <div class="pl-col-section-body">
                  <label>Rank <input type="checkbox" checked onchange="plToggleCol('rank',this.checked)"></label>
                  <label>Occupation <input type="checkbox" checked onchange="plToggleCol('occupation',this.checked)"></label>
                  <label>Career <input type="checkbox" checked onchange="plToggleCol('career_group',this.checked)"></label>
                  <label>City <input type="checkbox" checked onchange="plToggleCol('homecity',this.checked)"></label>
                  <label>Age <input type="checkbox" checked onchange="plToggleCol('character_age',this.checked)"></label>
                  <label>Group <input type="checkbox" checked onchange="plToggleCol('group',this.checked)"></label>
                  <label>Tags <input type="checkbox" checked onchange="plToggleCol('tags',this.checked)"></label>
                  <label>Agg <input type="checkbox" checked onchange="plToggleCol('agg_crimes',this.checked)"></label>
                  <label>Case Work <input type="checkbox" checked onchange="plToggleCol('case_work',this.checked)"></label>
                </div>
              </div>
            </div>
            <button class="btn-secondary" onclick="plRefresh()" id="pl-refresh-btn">Refresh</button>
            <span id="pl-refresh-status" style="font-size:0.8rem;color:var(--error,#f87171)"></span>
          </div>
          <div style="overflow-x:auto;margin-top:8px">
            <table class="pl-table" id="pl-table">
              <thead>
                <tr>
                  <th class="pl-th pl-th-filter" onclick="plSort('online_status')" data-col="online_status" style="width:18px" title="Online status"><span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('username')" data-col="username">Name <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('rank')" data-col="rank">Rank <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('occupation')" data-col="occupation">Occupation <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('career_group')" data-col="career_group">Career <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('homecity')" data-col="homecity">City <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('group')" data-col="group">Group <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter">Tags</th>
                  <th class="pl-th pl-th-filter" onclick="plSort('character_age')" data-col="character_age">Age <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('agg_crimes')" data-col="agg_crimes">Agg <span class="pl-sort-icon">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plSort('case_work')" data-col="case_work">Case Work <span class="pl-sort-icon">↕</span></th>
                </tr>
                <tr id="pl-filter-row">
                  <th class="pl-filter-cell"><select id="pl-filter-online" class="pl-filter-input" onchange="plFilter()">
                    <option value="">All</option>
                    <option value="local">Local</option>
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                  </select></th>
                  <th class="pl-filter-cell"><input type="text" id="pl-search" class="pl-filter-input" placeholder="Name…" oninput="plFilter()"></th>
                  <th class="pl-filter-cell"><select id="pl-filter-rank" class="pl-filter-input" onchange="plFilter()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-filter-occupation" class="pl-filter-input" onchange="plFilter()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-filter-career-group" class="pl-filter-input" onchange="plFilter()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-filter-homecity" class="pl-filter-input" onchange="plFilter()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-filter-group" class="pl-filter-input" onchange="plFilter()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-filter-tag" class="pl-filter-input" onchange="plFilter()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"></th>
                  <th class="pl-filter-cell"><select id="pl-filter-agg" class="pl-filter-input" onchange="plFilter()">
                    <option value="">All</option>
                    <option value="__none__">None</option>
                    <option value="whitelist">Whitelist</option>
                    <option value="blacklist">Blacklist</option>
                  </select></th>
                  <th class="pl-filter-cell"><select id="pl-filter-casework" class="pl-filter-input" onchange="plFilter()">
                    <option value="">All</option>
                    <option value="__none__">None</option>
                    <option value="whitelist">Whitelist</option>
                    <option value="blacklist">Blacklist</option>
                  </select></th>
                </tr>
              </thead>
              <tbody id="pl-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Groups tab -->
        <div id="pl-tab-groups" class="tab-panel">
          <div class="pl-toolbar" style="margin-bottom:10px">
            <input type="text" id="pl-new-group-name" class="task-select" placeholder="Group name…"
              onkeydown="if(event.key==='Enter')plCreateGroup()" style="min-width:140px">
            <select id="pl-new-group-type" class="task-select">
              <option value="neutral">Neutral</option>
              <option value="friendly">Friendly</option>
              <option value="enemy">Enemy</option>
            </select>
            <select id="pl-new-group-color" class="task-select pl-color-select" style="--pl-sel-color:#3498db"
              onchange="this.style.setProperty('--pl-sel-color',this.value)">
              <option value="#e74c3c">&#9679; Red</option>
              <option value="#e67e22">&#9679; Orange</option>
              <option value="#f1c40f">&#9679; Yellow</option>
              <option value="#2ecc71">&#9679; Green</option>
              <option value="#3498db" selected>&#9679; Blue</option>
              <option value="#9b59b6">&#9679; Purple</option>
              <option value="#e91e8c">&#9679; Pink</option>
              <option value="#1abc9c">&#9679; Teal</option>
              <option value="#aaaaaa">&#9679; Light Grey</option>
              <option value="#555555">&#9679; Dark Grey</option>
            </select>
            <button class="action-btn" onclick="plCreateGroup()">Create Group</button>
            <span id="pl-group-create-error" style="font-size:12px;color:var(--error,#f87171)"></span>
          </div>
          <div style="overflow-x:auto">
            <table class="pl-table" id="pl-groups-table">
              <thead>
                <tr>
                  <th class="pl-th">Name</th>
                  <th class="pl-th">Type</th>
                  <th class="pl-th">Colour</th>
                  <th class="pl-th">Agg</th>
                  <th class="pl-th">Case Work</th>
                  <th class="pl-th">Members</th>
                  <th class="pl-th" style="width:70px"></th>
                </tr>
              </thead>
              <tbody id="pl-groups-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Obituaries tab -->
        <div id="pl-tab-dead" class="tab-panel">
          <div style="overflow-x:auto;margin-top:8px">
            <table class="pl-table" id="pl-dead-table">
              <thead>
                <tr>
                  <th class="pl-th pl-th-filter" onclick="plDeadSort('username')" data-col="username">Name <span class="pl-sort-icon" id="pl-dead-icon-username">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plDeadSort('rank')" data-col="rank">Rank <span class="pl-sort-icon" id="pl-dead-icon-rank">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plDeadSort('occupation')" data-col="occupation">Occupation <span class="pl-sort-icon" id="pl-dead-icon-occupation">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plDeadSort('homecity')" data-col="homecity">City <span class="pl-sort-icon" id="pl-dead-icon-homecity">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plDeadSort('character_age')" data-col="character_age">Age <span class="pl-sort-icon" id="pl-dead-icon-character_age">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plDeadSort('died_at')" data-col="died_at">Died <span class="pl-sort-icon" id="pl-dead-icon-died_at">↕</span></th>
                </tr>
                <tr>
                  <th class="pl-filter-cell"><input type="text" id="pl-dead-search" class="pl-filter-input" placeholder="Name…" oninput="plRenderRecentDead()"></th>
                  <th class="pl-filter-cell"><select id="pl-dead-filter-rank" class="pl-filter-input" onchange="plRenderRecentDead()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-dead-filter-occupation" class="pl-filter-input" onchange="plRenderRecentDead()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-dead-filter-homecity" class="pl-filter-input" onchange="plRenderRecentDead()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"></th>
                  <th class="pl-filter-cell"></th>
                </tr>
              </thead>
              <tbody id="pl-dead-tbody">
                <tr><td colspan="6" style="padding:12px;color:var(--text-muted);text-align:center">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Births tab -->
        <div id="pl-tab-born" class="tab-panel">
          <div style="overflow-x:auto;margin-top:8px">
            <table class="pl-table" id="pl-born-table">
              <thead>
                <tr>
                  <th class="pl-th pl-th-filter" onclick="plBornSort('username')" data-col="username">Name <span class="pl-sort-icon" id="pl-born-icon-username">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plBornSort('rank')" data-col="rank">Rank <span class="pl-sort-icon" id="pl-born-icon-rank">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plBornSort('occupation')" data-col="occupation">Occupation <span class="pl-sort-icon" id="pl-born-icon-occupation">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plBornSort('homecity')" data-col="homecity">City <span class="pl-sort-icon" id="pl-born-icon-homecity">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plBornSort('character_age')" data-col="character_age">Age <span class="pl-sort-icon" id="pl-born-icon-character_age">↕</span></th>
                  <th class="pl-th pl-th-filter" onclick="plBornSort('born_at')" data-col="born_at">First Seen <span class="pl-sort-icon" id="pl-born-icon-born_at">↕</span></th>
                </tr>
                <tr>
                  <th class="pl-filter-cell"><input type="text" id="pl-born-search" class="pl-filter-input" placeholder="Name…" oninput="plRenderRecentBorn()"></th>
                  <th class="pl-filter-cell"><select id="pl-born-filter-rank" class="pl-filter-input" onchange="plRenderRecentBorn()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-born-filter-occupation" class="pl-filter-input" onchange="plRenderRecentBorn()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"><select id="pl-born-filter-homecity" class="pl-filter-input" onchange="plRenderRecentBorn()"><option value="">All</option></select></th>
                  <th class="pl-filter-cell"></th>
                  <th class="pl-filter-cell"></th>
                </tr>
              </thead>
              <tbody id="pl-born-tbody">
                <tr><td colspan="6" style="padding:12px;color:var(--text-muted);text-align:center">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Modals required by app.js player functions -->
<div id="pl-delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:24px;max-width:360px;width:90%">
    <p style="margin:0 0 16px">Remove <strong id="pl-delete-name"></strong> from player list?</p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-secondary" onclick="plCloseDeleteModal()">Cancel</button>
      <button class="action-btn" style="background:var(--error,#f87171)" onclick="plConfirmDelete()">Remove</button>
    </div>
  </div>
</div>

<div id="pl-group-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:24px;min-width:320px;max-width:480px;width:90%">
    <h3 id="pl-group-modal-title" style="margin:0 0 16px">Edit Group</h3>
    <div id="pl-group-modal-body"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn-secondary" onclick="plCloseGroupModal()">Cancel</button>
      <button class="action-btn" onclick="plSaveGroupModal()">Save</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
// Stubs for save functions that only apply to the main settings page
function autoSave() {}
function markDirty() {}
loadPlayers();
</script>
</body>
</html>
